{% extends "base.html" %}
{% block title %}Generate Barcode - Barcode Inventory{% endblock %}
{% block content %}
<div class="eyebrow">New Inventory Item</div>
<h1>Generate Barcode</h1>

<div class="form-card">
  <form id="generate-form">
    <div class="form-grid">
      <div class="field full">
        <label for="item_name">Item Name</label>
        <input type="text" id="item_name" name="item_name" required>
      </div>
      <div class="field full">
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="">None</option>
          {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="location">Location</label>
        <select id="location" name="location">
          <option value="">None</option>
          {% for l in locations %}
          <option value="{{ l.id }}">{{ l.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="status">Status</label>
        <select id="status" name="status">
          {% for code, label in status_choices %}
          <option value="{{ code }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="quantity">Quantity</label>
        <input type="number" id="quantity" name="quantity" value="0" min="0">
      </div>
      <div class="field full">
        <label for="barcode_type">Barcode Format</label>
        <select id="barcode_type" name="barcode_type">
          {% for code, label in barcode_type_choices %}
          <option value="{{ code }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div style="margin-top: 20px;">
      <button type="submit" id="submit-btn">Generate Barcode</button>
    </div>
  </form>

  <div class="result-panel" id="result-panel">
    <div id="result-pending">
      <span class="spinner"></span>
      Rendering barcode image in the background...
    </div>
    <div id="result-success" style="display: none;">
      <h3 id="result-item-name"></h3>
      <p class="mono" id="result-barcode-value"></p>
      <div class="barcode-preview">
        <img id="result-image" src="" alt="Generated barcode">
      </div>
      <a class="btn" id="result-link" href="#">View Item</a>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const form = document.getElementById('generate-form');
const resultPanel = document.getElementById('result-panel');
const resultPending = document.getElementById('result-pending');
const resultSuccess = document.getElementById('result-success');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', function (event) {
  event.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';
  resultPanel.classList.add('visible');
  resultPending.style.display = 'block';
  resultSuccess.style.display = 'none';

  const formData = new FormData(form);

  fetch('{% url "inventory:generate_barcode" %}', {
    method: 'POST',
    headers: { 'X-CSRFToken': getCsrfToken() },
    body: formData,
  })
    .then(response => response.json())
    .then(data => {
      if (data.task_id) {
        pollTask(data.task_id);
      } else {
        resultPending.textContent = 'Submission failed. Check the form fields.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Generate Barcode';
      }
    });
});

function pollTask(taskId) {
  const url = '/generate/status/' + taskId + '/';
  const interval = setInterval(function () {
    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.ready && data.item_id) {
          clearInterval(interval);
          resultPending.style.display = 'none';
          resultSuccess.style.display = 'block';
          document.getElementById('result-item-name').textContent = data.item_name;
          document.getElementById('result-barcode-value').textContent = data.barcode_value;
          document.getElementById('result-image').src = data.barcode_image_url;
          document.getElementById('result-link').href = data.detail_url;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Generate Barcode';
          form.reset();
        }
      });
  }, 1500);
}
</script>
{% endblock %}
